openapi: 3.0.3

info:
  title: API de Integração — Gestão de Assistência Técnica
  version: 1.0.0
  description: >
    API REST desenvolvida em Node.js e Express para permitir
    a comunicação entre a aplicação Mendix e o Moloni ON.

servers:
  - url: http://localhost:3000
    description: Servidor local de desenvolvimento

paths:
  /api/health:
    get:
      summary: Verificar o estado da Services Layer
      operationId: verificarEstado
      responses:
        "200":
          description: Servidor operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: gestao-assistencia-integracao

  /api/produtos:
    get:
      security:
        - ApiKeyInterna: []
      summary: Consultar produtos do Moloni ON
      description: >
        Obtém os produtos registados no Moloni ON através
        da camada de integração.
      operationId: consultarProdutos
      responses:
        "200":
          description: Lista de produtos obtida com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 5
                  produtos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Produto"

        "401":
          description: API Key interna não fornecida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

        "403":
          description: API Key interna inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

        "502":
          description: Erro na comunicação ou resposta do Moloni ON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /api/clientes:
    get:
      security:
        - ApiKeyInterna: []
      summary: Consultar clientes por NIF
      description: Pesquisa clientes no Moloni ON através do NIF.
      operationId: consultarClientes
      parameters:
        - name: nif
          in: query
          required: true
          description: NIF do cliente a pesquisar.
          schema:
            type: string
          example: seuNIF_testes_API
      responses:
        "200":
          description: Consulta efetuada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 1
                  clientes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cliente"

        "400":
          description: Parâmetro nif não fornecido ou vazio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

        "401":
          description: API Key interna não fornecida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

        "403":
          description: API Key interna inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

        "502":
          description: Erro na comunicação ou resposta do Moloni ON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
components:
  securitySchemes:
    ApiKeyInterna:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chave interna utilizada pelo Mendix e pelo n8n.

  schemas:
    Cliente:
      type: object
      properties:
        customerId:
          type: integer
          example: 420930
        name:
          type: string
          example: Cliente de Teste
        vat:
          type: string
          nullable: true
          example: "123456789"
        number:
          type: string
          example: "2"

    Produto:
      type: object
      properties:
        productId:
          type: integer
          example: 363517
        name:
          type: string
          example: Filtro de ar
        reference:
          type: string
          example: dr

    Erro:
      type: object
      properties:
        erro:
          type: string
          example: Não foi possível consultar os produtos.