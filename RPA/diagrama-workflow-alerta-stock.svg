<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="700" viewBox="0 0 1560 700" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
    <style>
      .t{font-size:17px;font-weight:bold;fill:#1a1a1a}
      .s{font-size:14px;fill:#444}
      .m{font-size:13px;fill:#444;font-family:Menlo,Consolas,monospace}
      .l{font-size:13px;fill:#555}
      .h{font-size:13px;font-weight:bold;fill:#777;letter-spacing:1.5px}
    </style>
  </defs>
  <rect width="1560" height="700" fill="#ffffff"/>

  <!-- zona n8n -->
  <rect x="20" y="20" width="1520" height="390" rx="14" fill="#fafafa" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="40" y="48" class="h">WORKFLOW N8N «ALERTA DE STOCK BAIXO»</text>

  <!-- gatilhos -->
  <rect x="40" y="80" width="210" height="96" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="145" y="114" text-anchor="middle" class="t">Schedule Trigger</text>
  <text x="145" y="138" text-anchor="middle" class="s">Todos os dias às 9h00</text>
  <text x="145" y="158" text-anchor="middle" class="s">(Europe/Lisbon)</text>

  <rect x="40" y="266" width="210" height="86" rx="10" fill="#ffffff" stroke="#f9a825" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="145" y="301" text-anchor="middle" class="t">Gatilho manual</text>
  <text x="145" y="325" text-anchor="middle" class="s">Testes a pedido</text>

  <!-- HTTP -->
  <rect x="320" y="166" width="220" height="100" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="430" y="198" text-anchor="middle" class="t">HTTP Request</text>
  <text x="430" y="222" text-anchor="middle" class="m">GET /api/produtos/stock</text>
  <text x="430" y="244" text-anchor="middle" class="s">Cabeçalho X-API-Key</text>

  <!-- Split -->
  <rect x="610" y="166" width="190" height="100" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="705" y="200" text-anchor="middle" class="t">Split Out</text>
  <text x="705" y="226" text-anchor="middle" class="s">Lista «produtos»</text>
  <text x="705" y="246" text-anchor="middle" class="s">→ um item por peça</text>

  <!-- If (losango) -->
  <polygon points="970,146 1080,216 970,286 860,216" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="970" y="208" text-anchor="middle" class="t">If</text>
  <text x="970" y="230" text-anchor="middle" class="m">stockAtual &lt;</text>
  <text x="970" y="247" text-anchor="middle" class="m">stockMinimo ?</text>

  <!-- Code -->
  <rect x="1140" y="80" width="170" height="96" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="1225" y="112" text-anchor="middle" class="t">Code (JS)</text>
  <text x="1225" y="136" text-anchor="middle" class="s">Junta as peças num</text>
  <text x="1225" y="156" text-anchor="middle" class="s">único alerta</text>

  <!-- Send Email -->
  <rect x="1350" y="80" width="170" height="96" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="1435" y="112" text-anchor="middle" class="t">Send Email</text>
  <text x="1435" y="136" text-anchor="middle" class="s">Assunto e corpo</text>
  <text x="1435" y="156" text-anchor="middle" class="s">vindos do Code</text>

  <!-- false -->
  <rect x="1140" y="266" width="170" height="76" rx="10" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1225" y="298" text-anchor="middle" class="t" fill="#757575">Sem ação</text>
  <text x="1225" y="320" text-anchor="middle" class="s">Peça com stock OK</text>

  <!-- setas n8n -->
  <path d="M250,128 C290,128 285,200 318,205" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <path d="M250,309 C290,309 285,232 318,228" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="540" y1="216" x2="606" y2="216" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="216" x2="856" y2="216" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1025,181 C1060,128 1090,128 1136,128" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="1040" y="132" class="l" fill="#2e7d32" font-weight="bold">sim</text>
  <path d="M1025,251 C1060,304 1090,304 1136,304" fill="none" stroke="#9e9e9e" stroke-width="2" marker-end="url(#r)"/>
  <text x="1040" y="318" class="l">não</text>
  <line x1="1310" y1="128" x2="1346" y2="128" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <!-- sistemas externos -->
  <text x="40" y="452" class="h">SISTEMAS EXTERNOS</text>

  <rect x="320" y="474" width="220" height="86" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="2"/>
  <text x="430" y="508" text-anchor="middle" class="t">Camada de Serviços</text>
  <text x="430" y="532" text-anchor="middle" class="s">Node.js + Express (REST)</text>

  <rect x="640" y="474" width="220" height="86" rx="10" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="750" y="508" text-anchor="middle" class="t">Moloni ON</text>
  <text x="750" y="532" text-anchor="middle" class="s">ERP (API GraphQL)</text>

  <rect x="1350" y="474" width="170" height="86" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
  <text x="1435" y="508" text-anchor="middle" class="t">Servidor SMTP</text>
  <text x="1435" y="532" text-anchor="middle" class="s">Gmail</text>

  <rect x="1350" y="600" width="170" height="70" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="2"/>
  <text x="1435" y="632" text-anchor="middle" class="t">Gestor</text>
  <text x="1435" y="654" text-anchor="middle" class="s">Recebe o alerta</text>

  <!-- setas externas -->
  <line x1="430" y1="268" x2="430" y2="470" stroke="#3949ab" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="442" y="364" class="l">REST/JSON</text>
  <text x="442" y="382" class="l">(X-API-Key)</text>
  <line x1="540" y1="517" x2="636" y2="517" stroke="#555" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="588" y="507" text-anchor="middle" class="l">GraphQL</text>
  <line x1="1435" y1="178" x2="1435" y2="470" stroke="#00897b" stroke-width="2" marker-end="url(#a)"/>
  <text x="1423" y="320" text-anchor="end" class="l">SMTP</text>
  <text x="1423" y="338" text-anchor="end" class="l">(porta 465, SSL)</text>
  <line x1="1435" y1="560" x2="1435" y2="596" stroke="#00897b" stroke-width="2" marker-end="url(#a)"/>
</svg>
